name: Compilar y publicar el libro

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Quarto se fija a la versión con la que se probó el libro: la capa
      # interactiva depende de su runtime de OJS y no conviene que cambie sola.
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.9.38

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          # El archivo de dependencias se llama requisitos.txt, no
          # requirements.txt, así que hay que señalarlo o el caché falla.
          cache-dependency-path: requisitos.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install -r requisitos.txt
          python -m ipykernel install --user --name libro --display-name "Python (libro)"

      # Los assets de shinylive pesan ~400 MB y no cambian entre compilaciones.
      - name: Caché de los assets de shinylive
        uses: actions/cache@v4
        with:
          path: ~/.cache/shinylive
          key: shinylive-${{ hashFiles('requisitos.txt') }}

      - name: Bajar los assets de shinylive
        run: shinylive assets download

      # Si los datos del libro están mal, no se publica.
      - name: Probar el módulo de datos y la prosa
        env:
          PYTHONPATH: ${{ github.workspace }}
          LIBRO_SIN_DESCARGA: "1"
        run: python -m pytest pruebas -q

      # LIBRO_SIN_DESCARGA garantiza que el libro compile con lo que viaja en el
      # repositorio. Si un capítulo pide una serie que no está, esto falla en el
      # acto con un mensaje claro en vez de bajar cientos de megabytes.
      - name: Compilar el libro
        env:
          QUARTO_PYTHON: python
          PYTHONPATH: ${{ github.workspace }}
          LIBRO_SIN_DESCARGA: "1"
        run: quarto render --to live-html 2>&1 | tee .ultima-compilacion.log

      # Quarto avisa de una referencia cruzada sin resolver con un WARN y sigue
      # de largo, así que sin este paso el libro se publica con enlaces rotos.
      - name: Comprobar las referencias cruzadas
        run: |
          if grep -q "Unable to resolve crossref" .ultima-compilacion.log; then
            echo "Referencias cruzadas sin resolver:"
            grep "Unable to resolve crossref" .ultima-compilacion.log | sed 's/^/  /'
            exit 1
          fi
          echo "referencias cruzadas: todas resueltas"

      # Aviso temprano: si el peso del sitio se descontrola, conviene saberlo.
      - name: Informar el peso del sitio
        run: |
          du -sh _site
          du -sh _site/site_libs/* | sort -rh | head -5

      # `retention-days: 1` no es una optimización: el sitio pesa unos 66 MB
      # comprimido y con la retención por omisión —90 días— la cuota de
      # almacenamiento de Actions se llena en una tarde de compilaciones. Cuando
      # se llena, el paso falla con "Artifact storage quota has been hit" y no se
      # publica nada. Pasó, y el arreglo fue borrar 1,7 GB de artefactos a mano.
      # Para publicar solo hace falta el último.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1

  # Publicar solo cuando el repositorio esté listo para ser público. Mientras
  # sea privado, GitHub Pages no está disponible y este paso fallaría en cada
  # empujón, dejando el historial lleno de cruces rojas. Para activarlo:
  #
  #   1. hacer público el repositorio
  #   2. habilitar Pages con origen "GitHub Actions"
  #   3. gh variable set PUBLICAR_PAGES --body si
  publicar:
    needs: compilar
    if: github.ref == 'refs/heads/main' && vars.PUBLICAR_PAGES == 'si'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
